plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// 版本号由 CI 传入（形如 2026.10.28.1），本地直接构建时读 version.txt
def versionFile = rootProject.file('version.txt')
def appVersionName = (project.findProperty('appVersion')
        ?: (versionFile.exists() ? versionFile.text.trim() : '0.0.0')).toString()
// versionCode 必须单调递增：日期拼成 8 位、当天序号补成 2 位（2026.10.29.1 → 2026102901），
// 直接去掉点号会因序号位数变化而变小（2026.10.28.34 → 2026102834 > 2026.10.29.1 → 202610291），被系统当成降级。
def versionParts = appVersionName.split('\\.')
def appVersionCode = 1
if (versionParts.length >= 4) {
    def dayPart = (versionParts[0] + versionParts[1] + versionParts[2]).toInteger()
    def seqPart = Math.min(versionParts[3].toInteger(), 99)
    appVersionCode = dayPart * 100 + seqPart
}

// 固定签名密钥：CI 首次构建时生成并提交到 signing/keystore.p12
// 只有始终用同一把钥匙签名，安装过的旧版本才能被覆盖更新
def signingStore = rootProject.file('signing/keystore.p12')

android {
    namespace 'io.github.ihatobatsugui.thenavel'
    compileSdk 34

    defaultConfig {
        applicationId 'io.github.ihatobatsugui.thenavel'
        minSdk 26
        targetSdk 34
        versionCode appVersionCode
        versionName appVersionName
    }

    signingConfigs {
        release {
            if (signingStore.exists()) {
                storeFile signingStore
                storeType 'PKCS12'
                storePassword 'thenavel'
                keyAlias 'thenavel'
                keyPassword 'thenavel'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (signingStore.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}
