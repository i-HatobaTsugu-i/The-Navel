name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install SDK packages
        run: |
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Ensure signing keystore
        run: |
          mkdir -p signing
          if [ -f signing/keystore.p12 ]; then
            echo "已有固定签名密钥"
            exit 0
          fi
          keytool -genkeypair -v \
            -keystore signing/keystore.p12 \
            -storetype PKCS12 \
            -alias thenavel \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass thenavel -keypass thenavel \
            -dname "CN=The Navel, OU=mod, O=iHatobaTsugu, L=NA, ST=NA, C=CN"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add signing/keystore.p12
          git commit -m "CI：固定 APK 签名密钥（keystore）"
          git push origin HEAD:main

      - name: Build release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: app/build/outputs/apk/release/*.apk
