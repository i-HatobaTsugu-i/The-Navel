name: Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install SDK packages
        run: |
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Ensure signing keystore
        run: |
          mkdir -p signing
          if [ -f signing/keystore.p12 ]; then
            echo "已有固定签名密钥"
            exit 0
          fi
          keytool -genkeypair -v \
            -keystore signing/keystore.p12 \
            -storetype PKCS12 \
            -alias thenavel \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass thenavel -keypass thenavel \
            -dname "CN=The Navel, OU=mod, O=iHatobaTsugu, L=NA, ST=NA, C=CN"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add signing/keystore.p12
          git commit -m "CI：固定 APK 签名密钥（keystore）"
          git push origin HEAD:main

      - name: Bump version
        id: version
        run: |
          TODAY=$(date -u +%Y.%m.%d)
          CUR=$(cat version.txt 2>/dev/null || true)
          LAST=${CUR##*.}
          case "$LAST" in
            ''|*[!0-9]*) N=1;;
            *) N=$(( LAST + 1 ));;
          esac
          VERSION="$TODAY.$N"
          echo "$VERSION" > version.txt

          PREV=$(git log -1 --format=%H -- version.txt)
          if [ -n "$PREV" ]; then
            CHANGES=$(git log --no-merges --pretty=format:"- %s" "$PREV..HEAD")
          else
            CHANGES=$(git log --no-merges --pretty=format:"- %s" -20)
          fi
          {
            echo "## 版本 $VERSION"
            echo ""
            echo "**下载**：见下方 Assets 里的 \`The-Navel-$VERSION.apk\`"
            echo ""
            echo "### 本次更新"
            echo "$CHANGES"
          } > notes.md

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.txt
          git commit -m "版本 $VERSION"
          git push origin HEAD:main
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        run: gradle assembleRelease --no-daemon --stacktrace -PappVersion=${{ steps.version.outputs.value }}

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=${{ steps.version.outputs.value }}
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/The-Navel-$VERSION.apk"
          gh release create "$VERSION" \
            "out/The-Navel-$VERSION.apk" \
            --title "$VERSION" \
            --notes-file notes.md

      - name: Drop older releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=${{ steps.version.outputs.value }}
          for tag in $(gh release list --limit 100 --json tagName -q '.[].tagName'); do
            if [ "$tag" != "$VERSION" ]; then
              echo "删除旧版本 $tag"
              gh release delete "$tag" --yes --cleanup-tag
            fi
          done
